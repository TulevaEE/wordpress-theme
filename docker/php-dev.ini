; Mounted to /usr/local/etc/php/conf.d/zz-dev.ini — the zz- prefix makes it load
; last so these win. Replaces the old root php.ini and uploads.ini, which
; duplicated each other and disagreed on memory_limit.

; The image ships opcache.revalidate_freq=2, so an edited template can take two
; seconds to show up and looks like a caching bug. 0 = stat on every request,
; which is free enough for 166 files.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Errors go to the log, not the page. WordPress (WP_DEBUG_LOG) captures them in
; wp-content/debug.log; PHP startup/other errors go to the container log. Inline
; display is off so deprecation noise from a production DB on PHP 8.5 does not
; render above every page. Flip these to On if you want errors in the browser.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On

memory_limit = 512M
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 600
max_input_time = 600
max_input_vars = 5000
